<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>Checkout</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item"><a href="/products">Products</a></li>
                        <li class="breadcrumb-item"><a href="/cart">Cart</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Checkout</li>
                    </ol>
                </nav>

                <h2 class="mb-4"><i class="fas fa-credit-card me-2"></i>Checkout</h2>
            </div>
        </div>

        <div class="row">
            <!-- Order Summary -->
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Order Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Quantity</th>
                                        <th>Price</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${cartItems}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <img th:src="${item.product.imageUrl}" alt="Product"
                                                     class="img-thumbnail me-2" style="width: 50px; height: 50px;">
                                                <div>
                                                    <strong th:text="${item.product.name}">Product Name</strong><br>
                                                    <small class="text-muted" th:text="${item.product.brand}">Brand</small>
                                                </div>
                                            </div>
                                        </td>
                                        <td th:text="${item.quantity}">1</td>
                                        <td>₹<span th:text="${#numbers.formatDecimal(item.product.price, 1, 2)}">0.00</span></td>
                                        <td>₹<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="3" class="text-end"><strong>Total:</strong></td>
                                        <td><strong>₹<span th:text="${#numbers.formatDecimal(cartSummary.totalPrice, 1, 2)}">0.00</span></strong></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Checkout Form -->
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Shipping Information</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/cart/checkout}" method="post">
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number *</label>
                                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                                       th:value="${user.phone}" required>
                            </div>

                            <div class="mb-3">
                                <label for="shippingAddress" class="form-label">Shipping Address *</label>
                                <textarea class="form-control" id="shippingAddress" name="shippingAddress"
                                          rows="4" th:text="${shippingAddress}" required></textarea>
                            </div>

                            <div class="alert alert-info">
                                <i class="fas fa-info-circle me-2"></i>
                                <strong>Payment:</strong> Cash on Delivery (COD) only
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-check me-2"></i>Place Order
                                </button>
                                <a href="/cart" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Cart
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Order Total Card -->
                <div class="card">
                    <div class="card-header">
                        <h5>Order Total</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between fw-bold">
                            <span>Total:</span>
                            <span>₹<span th:text="${#numbers.formatDecimal(cartSummary.totalPrice, 1, 2)}">0.00</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
