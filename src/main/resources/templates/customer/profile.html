<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>My Profile</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">My Profile</li>
                    </ol>
                </nav>

                <h2 class="mb-4"><i class="fas fa-user me-2"></i>My Profile</h2>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Profile Information</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/customer/profile}" method="post" th:object="${userDto}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger mt-1"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" readonly>
                                    <small class="text-muted">Email cannot be changed</small>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Phone Number *</label>
                                    <input type="tel" class="form-control" id="phone" th:field="*{phone}" required>
                                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger mt-1"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Account Type</label>
                                    <input type="text" class="form-control" value="Customer" readonly>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address *</label>
                                <textarea class="form-control" id="address" rows="3" th:field="*{address}" required></textarea>
                                <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger mt-1"></div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save me-2"></i>Update Profile
                                </button>
                                <a href="/customer/dashboard" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Account Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center">
                            <i class="fas fa-user-circle fa-4x text-success mb-3"></i>
                            <h6 th:text="${userDto.name}">User Name</h6>
                            <p class="text-muted" th:text="${userDto.email}">user@example.com</p>
                        </div>
                        <hr>
                        <div class="d-grid">
                            <a href="/customer/orders" class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-shopping-bag me-2"></i>View My Orders
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
