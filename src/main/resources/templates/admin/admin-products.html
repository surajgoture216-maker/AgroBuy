<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>Admin - Products Management</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-boxes me-2"></i>Products Management</h2>
                    <a href="/admin/products/add" class="btn btn-success">
                        <i class="fas fa-plus me-2"></i>Add Product
                    </a>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Brand</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="product : ${products.content}">
                                        <td th:text="${product.id}">1</td>
                                        <td>
                                            <img th:src="${product.imageUrl}" alt="Product" class="img-thumbnail" style="width: 50px; height: 50px;">
                                        </td>
                                        <td th:text="${product.name}">Product Name</td>
                                        <td th:text="${product.category}">Category</td>
                                        <td th:text="${product.brand}">Brand</td>
                                        <td>₹<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span></td>
                                        <td th:text="${product.stock}">0</td>
                                        <td>
                                            <span th:if="${product.isActive}" class="badge bg-success">Active</span>
                                            <span th:if="${!product.isActive}" class="badge bg-danger">Inactive</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-primary me-1">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a th:href="@{/admin/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger"
                                               onclick="return confirm('Are you sure you want to delete this product?')">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <nav th:if="${products.totalPages > 1}" aria-label="Products pagination">
                            <ul class="pagination justify-content-center">
                                <li th:class="'page-item' + (${currentPage == 0} ? ' disabled' : '')">
                                    <a class="page-link" th:href="${currentPage > 0} ? @{/admin/products(page=${currentPage - 1})} : '#'">Previous</a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                                    th:class="'page-item' + (${i == currentPage} ? ' active' : '')">
                                    <a class="page-link" th:href="@{/admin/products(page=${i})}" th:text="${i + 1}">1</a>
                                </li>
                                <li th:class="'page-item' + (${currentPage >= products.totalPages - 1} ? ' disabled' : '')">
                                    <a class="page-link" th:href="${currentPage < products.totalPages - 1} ? @{/admin/products(page=${currentPage + 1})} : '#'">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
