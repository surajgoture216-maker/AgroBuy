# Server Configuration
server.port=8889
server.servlet.context-path=/

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/fertilizer_shop?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=aduadi47
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Alternative: H2 Database for development/demo
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (only when using H2 database)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.webflux.throw-exception-if-no-handler-found=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.fertilizer=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Application Info
spring.application.name=Fertilizer Shop Application

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Actuator (optional - for monitoring)
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=always
