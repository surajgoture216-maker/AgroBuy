<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>My Dashboard</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4"><i class="fas fa-tachometer-alt me-2"></i>My Dashboard</h2>

                <!-- Welcome Message -->
                <div class="alert alert-success">
                    <h5 class="alert-heading">Welcome back, <span th:text="${user.name}">Customer</span>!</h5>
                    <p class="mb-0">Here's an overview of your account and recent activity.</p>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card bg-primary text-white">
                    <div class="card-body text-center">
                        <i class="fas fa-shopping-cart fa-2x mb-2"></i>
                        <h4 th:text="${totalOrders}">0</h4>
                        <p class="mb-0">Total Orders</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card bg-warning text-white">
                    <div class="card-body text-center">
                        <i class="fas fa-clock fa-2x mb-2"></i>
                        <h4 th:text="${pendingOrders}">0</h4>
                        <p class="mb-0">Pending Orders</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card bg-success text-white">
                    <div class="card-body text-center">
                        <i class="fas fa-check-circle fa-2x mb-2"></i>
                        <h4 th:text="${completedOrders}">0</h4>
                        <p class="mb-0">Completed Orders</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a href="/products" class="btn btn-success">
                                <i class="fas fa-shopping-bag me-2"></i>Continue Shopping
                            </a>
                            <a href="/cart" class="btn btn-outline-primary">
                                <i class="fas fa-shopping-cart me-2"></i>View Cart
                            </a>
                            <a href="/customer/orders" class="btn btn-outline-info">
                                <i class="fas fa-list me-2"></i>My Orders
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Account Management</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a href="/customer/profile" class="btn btn-outline-secondary">
                                <i class="fas fa-user-edit me-2"></i>Update Profile
                            </a>
                            <a href="/auth/logout" class="btn btn-outline-danger">
                                <i class="fas fa-sign-out-alt me-2"></i>Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
